<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Segmentasi Pelanggan{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <nav class="nav">
    <div class="wrap nav-in">
      <a class="brand" href="/">📊 SegmentaRFM</a>
      <div class="links">
        <a href="/" class="{{ 'on' if page=='home' }}">Home</a>
        <a href="/prediksi" class="{{ 'on' if page=='prediksi' }}">Prediksi</a>
        <a href="/contact" class="{{ 'on' if page=='contact' }}">Contact Us</a>
      </div>
    </div>
  </nav>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="foot">Ujian Akhir Python Framework · FastAPI + K-Means + PostgreSQL/MySQL</footer>
  <script src="{{ url_for('static', path='js/main.js') }}"></script>
</body>
</html>
